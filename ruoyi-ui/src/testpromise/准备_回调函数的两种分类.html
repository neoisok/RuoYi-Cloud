<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
        什么是回调函数
            1、我定义的
            2、我没调用
            3、最终执行了
            比如settimeout要传一个函数，这个函数我定义的，我没调用，但执行了
        1).同步回调
            理解：立即执行，完全执行完了才结束，不会放入回调队列中
            例子：数组便利相关的回调函数 /Promise的executor函数
        2).异步回调
            理解不会立即执行，会放入回调队列中将来执行
            例子：定时器回调 / ajax回调 /Promise的成功｜失败的回调
        */
       //1.同步回调函数
       const arr = [1,3,5]
       arr.forEach(item => {
        console.log(item)
       })
       console.log('forEach()之后')

       //2. 异步回调函数
       setTimeout(() => {
        console.log('timeout callback()')
       }, 0);
       console.log('setTimeout()之后')
    </script>
</body>
</html>
